[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scaffold"
description = "A placeholder build123d-based parametric modeling package (rename me for your project)"
requires-python = ">=3.10"
version = "0.1.0"
dependencies = ["build123d", "pytest", "ocp_vscode"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
